services:
  api:
    build:
      context: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://integrar:integrar@postgres:5432/integrar?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integrar
      POSTGRES_PASSWORD: integrar
      POSTGRES_DB: integrar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrar -d integrar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: